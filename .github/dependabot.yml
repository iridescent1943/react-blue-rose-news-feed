version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Pacific/Auckland
    open-pull-requests-limit: 3

  - package-ecosystem: bundler
    directory: /backend
    schedule:
      interval: monthly
      timezone: Pacific/Auckland
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      timezone: Pacific/Auckland
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: monthly
      timezone: Pacific/Auckland
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
